webdriver {


  driver = chrome
  capabilities { "goog:chromeOptions" {
   args = ["--window-size=1920,1080", "--disable-save-password-bubble",
           "--disable-features=PasswordLeakDetection,SafetyCheck,PasswordManagerOnboarding",
           "--disable-notifications"]
   prefs {
     credentials_enable_service = false
     "profile.password_manager_enabled" = false
     "profile.password_manager_leak_detection" = false
      # PdfDownloads prepares the absolute local download directory before PDF generation.
             "download.prompt_for_download" = false
             "download.directory_upgrade" = true
             "plugins.always_open_pdf_externally" = true
   } } }
  autodownload = true
  timeouts.implicitlywait = 0
  wait.for.timeout = 10000
}
headless.mode = false
serenity {
  test.root = "homeoffice"
}

environments {
  default {
    postcode.base.url = "https://api.postcodes.io"
    standard_user.username = "standard_user"
    standard_user.loginOutcome = SUCCESS
    locked_out_user.username = "locked_out_user"
    locked_out_user.loginOutcome = LOCKED_OUT
    problem_user.username = "problem_user"
    problem_user.loginOutcome = SUCCESS
    performance_glitch_user.username = "performance_glitch_user"
    performance_glitch_user.loginOutcome = SUCCESS
    error_user.username = "error_user"
    error_user.loginOutcome = SUCCESS
    visual_user.username = "visual_user"
    visual_user.loginOutcome = SUCCESS
    all_users.password = "secret_sauce"
  }
  staging { postcode.base.url = "https://api.postcodes.io" }
  grid {
    webdriver {
      driver = remote
      remote.driver = chrome
      remote.url = "http://localhost:4444"
      remote.url = ${?SELENIUM_REMOTE_URL}
      capabilities.browserName = "chrome"
    }
    headless.mode = false
  }
  # Equivalent legacy name; explicit values avoid Serenity 4.2.9 report substitution issues.
  remote {
    webdriver {
      driver = remote
      remote.driver = chrome
      remote.url = "http://localhost:4444"
      capabilities.browserName = "chrome"
    }
    headless.mode = false
  }
  saucelabs {
    webdriver {
      driver = remote
      remote.driver = chrome
      remote.url = "https://ondemand.us-west-1.saucelabs.com/wd/hub"
      capabilities {
        browserName = "chrome"
        browserVersion = "latest"
        platformName = "Windows 11"
        "sauce:options" {
          username = ${?SAUCE_USERNAME}
          accessKey = ${?SAUCE_ACCESS_KEY}
          build = ${?TEST_BUILD_NAME}
          name = "HomeOffice Cucumber"
          screenResolution = "1920x1080"
          recordVideo = true
          recordLogs = true
        }
      }
    }
    headless.mode = false
  }
  browserstack {
    webdriver {
      driver = remote
      remote.driver = chrome
      remote.url = "https://hub.browserstack.com/wd/hub"
      capabilities {
        browserName = "chrome"
        browserVersion = "latest"
        "bstack:options" {
          userName = ${?BROWSERSTACK_USERNAME}
          accessKey = ${?BROWSERSTACK_ACCESS_KEY}
          os = "Windows"
          osVersion = "11"
          projectName = "HomeOffice"
          buildName = ${?TEST_BUILD_NAME}
          sessionName = "HomeOffice Cucumber"
          local = false
          resolution = "1920x1080"
          video = true
          idleTimeout = 300
        }
      }
    }
    headless.mode = true
  }
}

app {
  paths {
    home = "/"
    inventory = "/inventory.html"
    inventoryItem = "/inventory-item.html"
    cart = "/cart.html"
    checkoutInfo = "/checkout-step-one.html"
    checkoutOverview = "/checkout-step-two.html"
    checkoutComplete = "/checkout-complete.html"
  }
  external.aboutDomain = "saucelabs.com"
  labels {
    appLogo = "Swag Labs"
    productsTitle = "Products"
    quantity = "QTY"
    description = "Description"
    continueShopping = "Continue Shopping"
    checkout = "Checkout"
    paymentInformation = "Payment Information:"
    shippingInformation = "Shipping Information:"
    priceTotal = "Price Total"
    addToCart = "Add to cart"
    remove = "Remove"
    generatePdfOrder = "Generate PDF order"
    loginErrorPrefix = "Epic sadface:"
  }
  menu {
    allItems = "All Items"
    about = "About"
    logout = "Logout"
    resetAppState = "Reset App State"
  }
  sortOptions {
    nameAscending = "Name (A to Z)"
    nameDescending = "Name (Z to A)"
    priceAscending = "Price (low to high)"
    priceDescending = "Price (high to low)"
  }
  footer {
    twitter { name = "Twitter", url = "https://twitter.com/saucelabs" }
    facebook { name = "Facebook", url = "https://www.facebook.com/saucelabs" }
    linkedin { name = "LinkedIn", url = "https://www.linkedin.com/company/sauce-labs/" }
  }
  currency.symbol = "$"
  cart {
    defaultQuantity = "1"
    actionTimeoutSeconds = 10
    actionPollingMillis = 300
  }
  # Observed SauceDemo rule, not a published contract: 8% of the item subtotal, rounded half-up to the cent.
  checkout {
    taxRate = "0.08"
    taxRounding = HALF_UP
  }
}

api {
  paths {
    lookup = "/postcodes/{postcode}"
    collection = "/postcodes"
  }
  timeouts {
    connectMillis = 5000
    readMillis = 10000
  }
  # postcodes.io documents a maximum of 100 postcodes per bulk request.
  bulkLimit = 100
  successStatus = 200
  nearestRadiusMeters = 1000
  ukBounds {
    minLatitude = 49.8
    maxLatitude = 60.9
    minLongitude = -8.74
    maxLongitude = 1.96
  }

}
