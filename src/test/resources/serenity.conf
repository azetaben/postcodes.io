framework {
  wait.default.timeout.seconds = 10

  pdf {
    extension = ".pdf"
    in.progress.extension = ".crdownload"
    temp.extension = ".tmp"
    signature = "%PDF-"
    download {
      dir = "downloadfiles"
      poll.millis = 500
      timeout.seconds = 45
    }
  }

  browser.download.dir.name = "Downloads"

  menu {
    open.timeout.seconds = 4
    hide.timeout.millis = 5000
    hide.poll.millis = 100
    hidden.style = "visibility: hidden"
    offscreen.style = "translate3d(-100%"
  }

  paths {
    download = "downloadfiles"
    upload = "file_uploads"
    reporting.csv = "reporting_csv_data"
    lighthouse.report = "report/lighthouse-report.json"
  }

  faker {
    seed = 42
    number.digits = 10
    password.minLength = 8
    password.maxLength = 14
  }
}

