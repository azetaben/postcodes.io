# Accessibility (axe-core) and performance budgets; override with -D<key>=<value>.
quality {
  accessibility {
    # Fail on violations at or above this impact: minor, moderate, serious, critical.
    failOnImpact = "critical"
    tags = "wcag2a,wcag2aa,wcag21a,wcag21aa"
    reportDir = "target/accessibility"
  }
  performance {
    ui {
      loadEventMs = 5000
      domContentLoadedMs = 3000
      firstContentfulPaintMs = 3000
    }
    lighthouse {
      # Executable on PATH (a project-local node_modules/.bin/lighthouse from `npm ci` is preferred when present).
      command = "lighthouse"
      # When false the scenario is skipped (not failed) if the CLI is unavailable.
      required = false
      timeoutSeconds = 180
      reportDir = "target/lighthouse"
      sessionCookie = "session-username"
      minPerformanceScore = 0.5
      firstContentfulPaintMs = 3000
      largestContentfulPaintMs = 4000
      totalBlockingTimeMs = 600
      cumulativeLayoutShift = 0.1
      speedIndexMs = 4500
    }
    api {
      lookupMs = 2000
      bulkMs = 3000
      reverseMs = 3000
    }
  }
}

# Optional credentials for Serenity's provider result-reporting plugins.
